services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: protocolo_oficio
    ports:
      - '5432:5432'
    volumes:
      - protocolo_oficio_pgdata:/var/lib/postgresql/data

volumes:
  protocolo_oficio_pgdata:
